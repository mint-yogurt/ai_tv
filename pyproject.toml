[project]
name = "aitv"
version = "0.1.0"
description = "A modular, mostly-local pipeline for making slightly cursed television"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "anthropic",
    "jsonschema",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
aitv = "aitv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aitv*"]

[tool.setuptools.package-data]
aitv = ["schema.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
